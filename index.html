<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DataSpace by UbiquitousGuide — explore multidimensional datasets with linked 3D and 2D scatter plots. All processing happens in your browser."
    />
    <meta name="theme-color" content="#f4f2ed" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DataSpace — multidimensional data exploration</title>
    <script>
      // Apply the stored theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("dataspace-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
